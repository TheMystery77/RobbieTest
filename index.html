<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocky Adventure</title>
  <style>
    :root { --ink: #17233c; --blue: #4f7cff; --gold: #ffd447; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #e9f7ff, #c7d7ff 55%, #ffdff0); display: grid; place-items: center; padding: 24px; }
    .shell { width: min(1100px, 100%); }
    .topbar, .help { background: rgba(255,255,255,.88); border: 3px solid var(--ink); box-shadow: 8px 8px 0 rgba(23,35,60,.18); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-radius: 18px 18px 10px 10px; flex-wrap: wrap; }
    .brand { font-weight: 950; letter-spacing: .08em; font-size: clamp(18px, 3vw, 28px); }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; font-weight: 800; }
    .pill { padding: 8px 12px; border-radius: 999px; background: #fff4ac; border: 2px solid var(--ink); }
    .game-wrap { position: relative; margin-top: 14px; }
    canvas { display: block; width: 100%; height: auto; border: 5px solid var(--ink); border-radius: 14px; background: #9edcff; box-shadow: 10px 10px 0 rgba(23,35,60,.2); image-rendering: pixelated; }
    .message { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(23,35,60,.92); color: white; padding: 10px 16px; border-radius: 999px; font-weight: 800; text-align: center; pointer-events: none; }
    .help { margin-top: 14px; padding: 12px 16px; border-radius: 10px 10px 18px 18px; font-weight: 700; text-align: center; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div class="brand">BLOCKY ADVENTURE</div>
      <div class="stats"><span class="pill" id="score">Coins: 0 / 8</span><span class="pill" id="status">Find the coins</span></div>
    </section>
    <div class="game-wrap"><canvas id="game" width="960" height="540"></canvas><div class="message" id="message">Collect every coin, then reach the glowing portal!</div></div>
    <div class="help">Move with WASD or arrow keys • Press Space to dash • Press R to restart</div>
  </main>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("score");
    const statusText = document.getElementById("status");
    const message = document.getElementById("message");
    const WORLD = { width: 2200, height: 1400 };
    const keys = {};
    const camera = { x: 0, y: 0 };
    const player = { x: 130, y: 180, w: 34, h: 48, speed: 4.2, dash: 0 };
    const walls = [
      { x: 0, y: 0, w: WORLD.width, h: 34, color: "#5b6a9b" }, { x: 0, y: WORLD.height - 34, w: WORLD.width, h: 34, color: "#5b6a9b" },
      { x: 0, y: 0, w: 34, h: WORLD.height, color: "#5b6a9b" }, { x: WORLD.width - 34, y: 0, w: 34, h: WORLD.height, color: "#5b6a9b" },
      { x: 300, y: 180, w: 460, h: 48, color: "#6c5ce7" }, { x: 300, y: 180, w: 48, h: 340, color: "#6c5ce7" },
      { x: 1040, y: 120, w: 52, h: 430, color: "#ef6c8c" }, { x: 1040, y: 500, w: 420, h: 52, color: "#ef6c8c" },
      { x: 1540, y: 220, w: 430, h: 48, color: "#2ebd91" }, { x: 1920, y: 220, w: 50, h: 320, color: "#2ebd91" },
      { x: 480, y: 820, w: 600, h: 50, color: "#f19b45" }, { x: 1030, y: 820, w: 50, h: 300, color: "#f19b45" },
      { x: 1380, y: 930, w: 460, h: 50, color: "#6c5ce7" }, { x: 1790, y: 930, w: 50, h: 260, color: "#6c5ce7" },
      { x: 150, y: 1030, w: 380, h: 48, color: "#2ebd91" }
    ];
    const coinSpots = [[180, 340], [600, 330], [900, 170], [1240, 300], [1670, 390], [700, 690], [1220, 1030], [1640, 1130]];
    let coins = [];
    let won = false;
    function reset() {
      player.x = 130; player.y = 80; player.dash = 0;
      coins = coinSpots.map(function (spot) { return { x: spot[0], y: spot[1], collected: false }; });
      won = false; message.textContent = "Collect every coin, then reach the glowing portal!"; message.style.display = "block"; statusText.textContent = "Find the coins"; updateScore();
    }
    function updateScore() {
      const collected = coins.filter(function (coin) { return coin.collected; }).length;
      scoreText.textContent = "Coins: " + collected + " / " + coins.length;
      if (collected === coins.length && !won) { statusText.textContent = "Portal unlocked!"; message.textContent = "Portal unlocked! Find the glowing green square."; }
    }
    function overlaps(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
    function blocked(x, y) { const body = { x: x, y: y, w: player.w, h: player.h }; return walls.some(function (wall) { return overlaps(body, wall); }); }
    function movePlayer(dx, dy) {
      const nextX = player.x + dx; if (!blocked(nextX, player.y)) player.x = nextX;
      const nextY = player.y + dy; if (!blocked(player.x, nextY)) player.y = nextY;
    }
    function update() {
      if (won) return;
      let dx = 0; let dy = 0;
      if (keys.ArrowLeft || keys.a) dx -= 1; if (keys.ArrowRight || keys.d) dx += 1; if (keys.ArrowUp || keys.w) dy -= 1; if (keys.ArrowDown || keys.s) dy += 1;
      const length = Math.hypot(dx, dy) || 1; const boost = player.dash > 0 ? 2.2 : 1;
      movePlayer((dx / length) * player.speed * boost, (dy / length) * player.speed * boost); if (player.dash > 0) player.dash -= 1;
      coins.forEach(function (coin) { if (!coin.collected && Math.hypot(player.x + player.w / 2 - coin.x, player.y + player.h / 2 - coin.y) < 34) { coin.collected = true; updateScore(); } });
      const collectedAll = coins.every(function (coin) { return coin.collected; }); const portal = { x: 2030, y: 1080, w: 100, h: 100 };
      if (collectedAll && overlaps(player, portal)) { won = true; statusText.textContent = "You win!"; message.textContent = "You finished the obby! Press R to play again."; }
    }
    function drawWorld() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height); sky.addColorStop(0, "#8ed8ff"); sky.addColorStop(1, "#d9f5ff"); ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.save(); ctx.translate(-camera.x, -camera.y); ctx.fillStyle = "#b9e6a2"; ctx.fillRect(0, 0, WORLD.width, WORLD.height);
      ctx.strokeStyle = "rgba(69, 117, 92, .18)"; ctx.lineWidth = 2;
      for (let x = 40; x < WORLD.width; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.height); ctx.stroke(); }
      for (let y = 40; y < WORLD.height; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD.width, y); ctx.stroke(); }
      walls.forEach(function (wall) { ctx.fillStyle = "rgba(23, 35, 60, .22)"; ctx.fillRect(wall.x + 9, wall.y + 10, wall.w, wall.h); ctx.fillStyle = wall.color; ctx.fillRect(wall.x, wall.y, wall.w, wall.h); ctx.fillStyle = "rgba(255,255,255,.22)"; ctx.fillRect(wall.x, wall.y, wall.w, 8); });
      const collectedAll = coins.every(function (coin) { return coin.collected; }); const portal = { x: 2030, y: 1080, w: 100, h: 100 };
      ctx.fillStyle = collectedAll ? "#4dffbd" : "#78909c"; ctx.fillRect(portal.x, portal.y, portal.w, portal.h); ctx.strokeStyle = "#17233c"; ctx.lineWidth = 6; ctx.strokeRect(portal.x, portal.y, portal.w, portal.h); ctx.fillStyle = "#17233c"; ctx.font = "bold 18px system-ui"; ctx.fillText(collectedAll ? "GO!" : "LOCKED", portal.x + 18, portal.y + 58);
      coins.forEach(function (coin) { if (coin.collected) return; ctx.fillStyle = "rgba(23,35,60,.2)"; ctx.beginPath(); ctx.ellipse(coin.x, coin.y + 17, 18, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#ffd447"; ctx.beginPath(); ctx.arc(coin.x, coin.y, 17, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#b57900"; ctx.lineWidth = 4; ctx.stroke(); ctx.fillStyle = "#fff6b0"; ctx.font = "bold 15px system-ui"; ctx.fillText("$", coin.x - 5, coin.y + 6); });
      ctx.fillStyle = "rgba(23,35,60,.25)"; ctx.fillRect(player.x + 4, player.y + player.h - 2, player.w + 4, 10); ctx.fillStyle = "#263b7a"; ctx.fillRect(player.x + 4, player.y + 25, 28, 23); ctx.fillStyle = "#ffcfad"; ctx.fillRect(player.x + 6, player.y, 24, 24); ctx.fillStyle = "#5b3a29"; ctx.fillRect(player.x + 5, player.y, 26, 8); ctx.fillStyle = "#263b7a"; ctx.fillRect(player.x + 5, player.y + 46, 9, 11); ctx.fillRect(player.x + 22, player.y + 46, 9, 11); ctx.fillStyle = "#17233c"; ctx.fillRect(player.x + 12, player.y + 12, 4, 4); ctx.fillRect(player.x + 22, player.y + 12, 4, 4);
      ctx.restore();
    }
    function loop() { update(); camera.x = Math.max(0, Math.min(WORLD.width - canvas.width, player.x - canvas.width / 2)); camera.y = Math.max(0, Math.min(WORLD.height - canvas.height, player.y - canvas.height / 2)); drawWorld(); requestAnimationFrame(loop); }
    window.addEventListener("keydown", function (event) { keys[event.key] = true; if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault(); if (event.key === " ") player.dash = 18; if (event.key.toLowerCase() === "r") reset(); });
    window.addEventListener("keyup", function (event) { keys[event.key] = false; });
    reset(); loop();
  </script>
</body>
</html>
