<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocky Adventure 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #8fd8ff; color: #17233c; }
    #game { width: 100vw; height: 100vh; display: block; }
    .hud { position: fixed; inset: 18px 18px auto 18px; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
    .card { background: rgba(255,255,255,.9); border: 3px solid #17233c; border-radius: 16px; padding: 12px 16px; box-shadow: 6px 6px 0 rgba(23,35,60,.2); }
    .title { font-weight: 950; letter-spacing: .08em; font-size: clamp(18px, 3vw, 28px); }
    .subtitle { margin-top: 3px; font-weight: 700; opacity: .75; }
    .stats { font-weight: 900; text-align: right; }
    .help { position: fixed; z-index: 2; bottom: 18px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 36px); text-align: center; font-weight: 800; white-space: nowrap; }
    #message { position: fixed; z-index: 3; top: 115px; left: 50%; transform: translateX(-50%); color: white; background: rgba(23,35,60,.9); border-radius: 999px; padding: 10px 18px; font-weight: 900; text-align: center; pointer-events: none; }
    @media (max-width: 650px) { .hud { flex-direction: column; } .stats { text-align: left; } .help { white-space: normal; } #message { top: 180px; width: calc(100vw - 36px); } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="card"><div class="title">BLOCKY ADVENTURE 3D</div><div class="subtitle">A tiny original block-world obby</div></div>
    <div class="card stats"><div id="score">Crystals: 0 / 8</div><div id="status">Explore the world</div></div>
  </div>
  <div id="message">Collect every crystal, then enter the glowing portal!</div>
  <div class="card help">WASD / arrows: move &nbsp; • &nbsp; Shift: sprint &nbsp; • &nbsp; Space: jump &nbsp; • &nbsp; R: restart</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script>
    const canvas = document.getElementById("game");
    const scoreText = document.getElementById("score");
    const statusText = document.getElementById("status");
    const message = document.getElementById("message");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fd8ff);
    scene.fog = new THREE.Fog(0x8fd8ff, 55, 150);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 250);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    scene.add(new THREE.HemisphereLight(0xdaf5ff, 0x507344, 2.2));
    const sun = new THREE.DirectionalLight(0xffffff, 3.2);
    sun.position.set(-25, 35, 20); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); scene.add(sun);

    const mats = {
      grass: new THREE.MeshStandardMaterial({ color: 0x73c95c, roughness: 0.9 }),
      dirt: new THREE.MeshStandardMaterial({ color: 0x9a623c, roughness: 1 }),
      purple: new THREE.MeshStandardMaterial({ color: 0x7664e8, roughness: 0.75 }),
      pink: new THREE.MeshStandardMaterial({ color: 0xef6c8c, roughness: 0.75 }),
      orange: new THREE.MeshStandardMaterial({ color: 0xf2a14b, roughness: 0.75 }),
      teal: new THREE.MeshStandardMaterial({ color: 0x2ebd91, roughness: 0.75 }),
      blue: new THREE.MeshStandardMaterial({ color: 0x4f7cff, roughness: 0.75 }),
      gold: new THREE.MeshStandardMaterial({ color: 0xffd447, emissive: 0x6b4300, emissiveIntensity: 0.35, metalness: 0.5, roughness: 0.25 }),
      portal: new THREE.MeshStandardMaterial({ color: 0x56ffd0, emissive: 0x159a78, emissiveIntensity: 1.2, metalness: 0.2, roughness: 0.2 }),
      avatar: new THREE.MeshStandardMaterial({ color: 0x3854b5, roughness: 0.8 }),
      skin: new THREE.MeshStandardMaterial({ color: 0xffcfad, roughness: 0.85 }),
      hair: new THREE.MeshStandardMaterial({ color: 0x5b3a29, roughness: 0.9 })
    };

    const platforms = [];
    function block(x, y, z, w, h, d, material) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y + h / 2, z); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
      platforms.push({ x: x, z: z, w: w, d: d, top: y + h });
      return mesh;
    }
    block(0, -0.5, 0, 100, 1, 100, mats.grass);
    block(-9, 0.5, -8, 10, 2, 5, mats.purple);
    block(7, 1, -14, 10, 2, 5, mats.pink);
    block(20, 1.5, -5, 8, 3, 8, mats.orange);
    block(30, 2, -18, 10, 4, 6, mats.teal);
    block(18, 0.5, 12, 13, 2, 6, mats.blue);
    block(3, 1.5, 20, 10, 3, 7, mats.purple);
    block(-15, 2, 16, 9, 4, 8, mats.orange);
    block(-27, 1, 4, 10, 2, 7, mats.pink);
    block(-32, 2, -15, 9, 4, 8, mats.teal);

    const grid = new THREE.GridHelper(100, 50, 0x4d9a57, 0x91ce86);
    grid.position.y = 0.02; scene.add(grid);

    const player = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.35, 0.7), mats.avatar); body.position.y = 1.35; body.castShadow = true; player.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), mats.skin); head.position.y = 2.45; head.castShadow = true; player.add(head);
    const hair = new THREE.Mesh(new THREE.BoxGeometry(0.94, 0.22, 0.94), mats.hair); hair.position.y = 2.88; hair.castShadow = true; player.add(hair);
    const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.8, 0.5), mats.avatar); leg1.position.set(-0.28, 0.4, 0); leg1.castShadow = true; player.add(leg1);
    const leg2 = leg1.clone(); leg2.position.x = 0.28; player.add(leg2);
    player.position.set(0, 0, 18); scene.add(player);

    const crystalSpots = [[-8, -8, 3], [7, -14, 4], [20, -5, 5], [30, -18, 7], [18, 12, 4], [3, 20, 5], [-15, 16, 7], [-27, 4, 4]];
    const crystals = [];
    crystalSpots.forEach(function (spot) {
      const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.7, 0), mats.gold);
      crystal.position.set(spot[0], spot[2] + 1.1, spot[1]); crystal.castShadow = true; scene.add(crystal);
      crystals.push({ mesh: crystal, collected: false });
    });

    const portal = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.28, 14, 40), mats.portal);
    ring.rotation.x = Math.PI / 2; portal.add(ring);
    const portalCore = new THREE.Mesh(new THREE.CircleGeometry(1.9, 32), new THREE.MeshBasicMaterial({ color: 0x173b63, transparent: true, opacity: 0.78 }));
    portalCore.rotation.x = -Math.PI / 2; portalCore.position.y = 0.02; portal.add(portalCore);
    portal.position.set(30, 0, 25); scene.add(portal);

    const keys = {};
    let velocityY = 0;
    let grounded = true;
    let won = false;
    const clock = new THREE.Clock();
    const baseSpeed = 8;
    const baseFov = 60;
    const sprintFov = 90;
    let sprintBlend = 0;

    function reset() {
      player.position.set(0, 0, 18); velocityY = 0; grounded = true; won = false;
      crystals.forEach(function (crystal) { crystal.collected = false; crystal.mesh.visible = true; });
      scoreText.textContent = "Crystals: 0 / " + crystals.length;
      statusText.textContent = "Explore the world";
      message.textContent = "Collect every crystal, then enter the glowing portal!";
      message.style.display = "block";
    }
    function onPlatform(x, z, feetY) {
      return platforms.some(function (p) { return Math.abs(x - p.x) < p.w / 2 - 0.45 && Math.abs(z - p.z) < p.d / 2 - 0.45 && feetY <= p.top + 0.12 && feetY >= p.top - 0.55; });
    }
    function collectCrystals() {
      let total = 0;
      crystals.forEach(function (crystal) {
        if (!crystal.collected && player.position.distanceTo(crystal.mesh.position) < 2.1) { crystal.collected = true; crystal.mesh.visible = false; }
        if (crystal.collected) total += 1;
      });
      scoreText.textContent = "Crystals: " + total + " / " + crystals.length;
      if (total === crystals.length && !won) { statusText.textContent = "Portal unlocked!"; message.textContent = "Portal unlocked! Walk into the glowing ring."; }
    }
    function update(dt) {
      if (won) return;
      const sprintTarget = keys.Shift ? 1 : 0;
      sprintBlend += (sprintTarget - sprintBlend) * (1 - Math.pow(0.0001, dt));
      const currentFov = baseFov + (sprintFov - baseFov) * sprintBlend;
      if (Math.abs(camera.fov - currentFov) > 0.01) {
        camera.fov = currentFov;
        camera.updateProjectionMatrix();
      }
      const currentSpeed = baseSpeed * (1 + sprintBlend);
      let x = 0; let z = 0;
      if (keys.ArrowLeft || keys.a) x -= 1; if (keys.ArrowRight || keys.d) x += 1; if (keys.ArrowUp || keys.w) z -= 1; if (keys.ArrowDown || keys.s) z += 1;
      const length = Math.hypot(x, z) || 1;
      if (x || z) { x /= length; z /= length; player.position.x += x * currentSpeed * dt; player.position.z += z * currentSpeed * dt; player.rotation.y = Math.atan2(x, z); }
      player.position.x = Math.max(-46, Math.min(46, player.position.x)); player.position.z = Math.max(-46, Math.min(46, player.position.z));
      velocityY -= 24 * dt; player.position.y += velocityY * dt;
      if (velocityY <= 0 && onPlatform(player.position.x, player.position.z, player.position.y)) { player.position.y = platforms.find(function (p) { return Math.abs(player.position.x - p.x) < p.w / 2 - 0.45 && Math.abs(player.position.z - p.z) < p.d / 2 - 0.45 && player.position.y <= p.top + 0.12 && player.position.y >= p.top - 0.55; }).top; velocityY = 0; grounded = true; } else { grounded = false; }
      collectCrystals(); portal.rotation.y += dt * 1.5; ring.rotation.z += dt * 0.8;
      const unlocked = crystals.every(function (crystal) { return crystal.collected; });
      if (unlocked && player.position.distanceTo(portal.position) < 3.5) { won = true; statusText.textContent = "You win!"; message.textContent = "You finished the 3D obby! Press R to play again."; }
      crystals.forEach(function (crystal, index) { if (!crystal.collected) { crystal.mesh.rotation.y += dt * 2.4; crystal.mesh.position.y += Math.sin(clock.elapsedTime * 3 + index) * 0.003; } });
    }
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05); update(dt);
      const target = new THREE.Vector3(player.position.x, player.position.y + 1.1, player.position.z);
      const desired = new THREE.Vector3(player.position.x + 10, player.position.y + 8, player.position.z + 13);
      camera.position.lerp(desired, 1 - Math.pow(0.001, dt)); camera.lookAt(target);
      renderer.render(scene, camera); requestAnimationFrame(animate);
    }
    window.addEventListener("keydown", function (event) {
      keys[event.key] = true;
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();
      if (event.key === " " && grounded && !won) { velocityY = 10; grounded = false; }
      if (event.key.toLowerCase() === "r") reset();
    });
    window.addEventListener("keyup", function (event) { keys[event.key] = false; });
    window.addEventListener("resize", function () { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    reset(); animate();
  </script>
</body>
</html>
